[package]
name = "cred-swap-core"
description = "Detection, consistent pseudonymization and restoration of PII and credentials in text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["os-rng"]

# Draws seeds from the operating system, via `Surrogates::random`.
#
# Off for wasm32-unknown-unknown, which has no OS entropy source: a browser
# build gets its seed from `crypto.getRandomValues` on the JavaScript side and
# passes it in. Turning this off also drops the `getrandom` dependency, which
# does not build for that target without extra configuration.
os-rng = ["rand/thread_rng", "rand/os_rng", "rand/std"]

# Exposes `cred_swap_core::fixtures` so other crates' tests can use the same
# synthetic credential strings.
fixtures = []

[dependencies]
aho-corasick.workspace = true
hmac.workspace = true
rand.workspace = true
rand_chacha.workspace = true
regex.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
