name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-13,       target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p cred-swap-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="cred-swap-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ -f "target/${{ matrix.target }}/release/cred-swap.exe" ]; then
            cp "target/${{ matrix.target }}/release/cred-swap.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/cred-swap" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist && tar -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  browser:
    name: Browser package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build
        run: wasm-pack build crates/cred-swap-wasm --target web --out-dir pkg --release

      - name: Package
        run: |
          set -euo pipefail
          name="cred-swap-wasm-${{ github.ref_name }}"
          mkdir -p dist
          cp LICENSE crates/cred-swap-wasm/pkg/
          tar -czf "dist/${name}.tar.gz" -C crates/cred-swap-wasm pkg

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [binaries, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: true
