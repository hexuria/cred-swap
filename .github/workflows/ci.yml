name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures here. They are cheap to fix at review time and
  # expensive to fix once a thousand of them have accumulated.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Clippy (browser build)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p cred-swap-wasm --target wasm32-unknown-unknown --all-targets

      - name: Build the documentation
        run: cargo doc --workspace --no-deps --document-private-items

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --all-features

      # The vault is written owner-only, and the session directory is built
      # from a user-supplied name. Both are platform-specific enough to be
      # worth running everywhere rather than trusting to one runner.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          export CRED_SWAP_HOME="${RUNNER_TEMP}/cred-swap-ci"
          cargo build --release -p cred-swap-cli
          BIN=$(ls target/release/cred-swap target/release/cred-swap.exe 2>/dev/null | head -1)

          original='Email dana@corp.com, card 4242 4242 4242 4242, from 198.51.100.7'
          scrubbed=$(printf '%s' "$original" | "$BIN" scrub 2>/dev/null)
          restored=$(printf '%s' "$scrubbed" | "$BIN" restore 2>/dev/null)

          test "$scrubbed" != "$original" || { echo "nothing was scrubbed"; exit 1; }
          test "$restored" = "$original" || {
            echo "round trip changed the text"
            printf 'expected: %s\ngot:      %s\n' "$original" "$restored"
            exit 1
          }
          echo "$scrubbed" | grep -q 'dana@corp.com' && { echo "the original leaked"; exit 1; }
          echo "scrub and restore round-tripped cleanly"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "MSRV is ${version}"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Checked, not tested: the point is that a user on the oldest supported
      # compiler can build this, and dev-dependencies may need a newer one.
      - name: Check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  wasm:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Runs the bindings in Node, which has the Web Crypto API the seed
      # generator needs. This is the check that the boundary works, not just
      # that it compiles.
      - name: Test the bindings
        run: wasm-pack test --node crates/cred-swap-wasm

      - name: Build the package
        run: wasm-pack build crates/cred-swap-wasm --target web --out-dir pkg --release

      - name: Report the bundle size
        run: |
          size=$(wc -c < crates/cred-swap-wasm/pkg/cred_swap_wasm_bg.wasm)
          printf '### Browser bundle\n\n`%s` is %s KiB.\n' \
            cred_swap_wasm_bg.wasm "$((size / 1024))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cred-swap-wasm
          path: crates/cred-swap-wasm/pkg/
          if-no-files-found: error

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Detection rules are only as good as what they catch. This runs the tool
  # over its own source: a hit is either a real secret or a rule that misfires
  # on ordinary code, and both are worth knowing about.
  dogfood:
    name: Scan our own source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p cred-swap-cli

      # .cred-swap.toml is the baseline: it waives the specific synthetic
      # strings the rule tests depend on, by value, and leaves every rule
      # armed. A credential that is not named there fails this job.
      - name: Scan
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r file; do
            if ! ./target/release/cred-swap detect --strict --config .cred-swap.toml "$file"; then
              echo "::error file=${file}::cred-swap found a credential here. If it is a test fixture, add it to .cred-swap.toml with a reason."
              status=1
            fi
          done < <(git ls-files '*.rs' '*.toml' '*.yml' '*.md' '*.html')
          exit "$status"
